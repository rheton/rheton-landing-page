{{- $name := .name -}}
{{- $class := .class | default "" -}}
{{- if eq $name "resume" -}}
<svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#17181c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="{{ $class }}"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><path d="M14 2v6h6"></path><path d="M9 13h6"></path><path d="M9 17h6"></path><path d="M9 9h1"></path></svg>
{{- else if eq $name "flow" -}}
<svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#17181c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="{{ $class }}"><rect x="3" y="3" width="8" height="8" rx="2"></rect><path d="M7 11v3a2 2 0 0 0 2 2h6"></path><rect x="13" y="13" width="8" height="8" rx="2"></rect></svg>
{{- else if eq $name "eye" -}}
<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#17181c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="{{ $class }}" data-icon="eye"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"></path><circle cx="12" cy="12" r="3"></circle></svg>
{{- else if eq $name "brain" -}}
<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#17181c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="{{ $class }}" data-icon="brain"><path d="M9 18h6"></path><path d="M10 22h4"></path><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.1V17h6v-2.2c0-.8.4-1.6 1-2.1A7 7 0 0 0 12 2z"></path></svg>
{{- else if eq $name "wave" -}}
<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#17181c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="{{ $class }}" data-icon="wave">
  <path d="M2 12h2" class="rh-wave-bar" data-bar="1"></path>
  <path d="M6 8v8" class="rh-wave-bar" data-bar="2"></path>
  <path d="M10 4v16" class="rh-wave-bar" data-bar="3"></path>
  <path d="M14 8v8" class="rh-wave-bar" data-bar="4"></path>
  <path d="M18 5v14" class="rh-wave-bar" data-bar="5"></path>
  <path d="M22 12h-2" class="rh-wave-bar" data-bar="6"></path>
</svg>
{{- end -}}
