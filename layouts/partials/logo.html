{{- $size := .size | default 22 -}}
{{- $markSize := add $size 4 -}}
<a href="{{ "/" | relURL }}" class="rh-logo" aria-label="rheton home">
  <img src="{{ "img/rheton-logo-text.png" | relURL }}" alt="Rheton" height="{{ $markSize }}" class="rh-logo-full">
  <img src="{{ "img/rheton-logo-icon.svg" | relURL }}" alt="Rheton" height="{{ $markSize }}" width="{{ $markSize }}" class="rh-logo-icon">
</a>
